<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GCI Golf Zähler</title>
<link rel="icon" href="assets/favicon.png">
<style>
  /* Stil angelehnt an golfclub-isernhagen.de (Farben, Schriften Playfair Display + Inter, Wappen). */
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; font-display: swap; src: url(fonts/inter-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-weight: 700; font-display: swap; src: url(fonts/playfair-display-latin-700-normal.woff2) format("woff2"); }
  :root {
    --white: #ffffff; --offwhite: #f9f9f9; --sand: #f0eee9; --lightgreen: #cfe3be;
    --green: #477d24; --darkgreen: #18433a; --red: #e41b13; --ink: #000000; --muted: #5d6b64;
    --line: #dcd9d1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--sand); color: var(--ink);
    font: 15px/1.45 Inter, Arial, Helvetica, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  #sheet { background: var(--white); overflow: hidden; box-shadow: 0 2px 10px rgba(24, 67, 58, .08); }
  header {
    background: var(--darkgreen); color: var(--white);
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  }
  header img.wappen { width: 46px; height: auto; flex: none; }
  header .brand { flex: 1; min-width: 0; }
  header img.schriftzug { display: block; width: 100%; max-width: 230px; height: auto; }
  .content { padding: 16px 16px 14px; }
  h1 {
    margin: 0; font: 700 24px/1.2 "Playfair Display", Georgia, serif; color: var(--darkgreen);
  }
  .bar { width: 44px; height: 3px; background: var(--green); margin: 8px 0 4px; }
  h2 {
    font: 700 19px/1.2 "Playfair Display", Georgia, serif; color: var(--darkgreen);
    margin: 20px 0 8px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  h2:first-of-type { border-top: 0; padding-top: 4px; }
  table { border-collapse: collapse; width: 100%; margin: 4px 0 10px; table-layout: fixed; }
  th, td { border: 1px solid var(--line); text-align: center; padding: 5px 0; font-variant-numeric: tabular-nums; }
  th { background: var(--lightgreen); font-size: 12px; color: var(--darkgreen); font-weight: 600; }
  td { font-size: 15px; font-weight: 600; }
  tr:nth-child(odd) td { background: var(--offwhite); }
  th.d, td.d { width: 72px; text-align: left; padding-left: 7px; font-weight: 400; font-size: 13px; }
  td.x { color: var(--red); font-weight: 700; }
  .legend { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .legend b { color: var(--red); }
  footer { background: var(--green); height: 6px; }
  .actions { display: flex; gap: 10px; margin: 16px 0 0; }
  button {
    flex: 1; border: 2px solid var(--darkgreen); border-radius: 0; padding: 12px; cursor: pointer;
    font: 600 15px Inter, Arial, sans-serif; background: var(--darkgreen); color: var(--white);
  }
  button.secondary { background: transparent; color: var(--darkgreen); }
  .empty p { color: var(--muted); }
  @media print {
    body { background: #fff; }
    main { max-width: none; padding: 0; }
    #sheet { box-shadow: none; }
    header, th, tr:nth-child(odd) td, footer { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .actions { display: none; }
    h2 { break-after: avoid; }
    table { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <div id="sheet">
    <header>
      <img class="wappen" src="assets/gci-wappen.png" alt="Wappen Golfclub Isernhagen">
      <div class="brand"><img class="schriftzug" src="assets/gci-schriftzug.svg" alt="Golfclub Isernhagen"></div>
    </header>
    <div class="content" id="content"></div>
    <footer></footer>
  </div>
  <div class="actions" id="actions" hidden>
    <button id="img">Als Bild teilen</button>
    <button id="pdf" class="secondary">PDF / Drucken</button>
  </div>
</main>
<script src="html2canvas.min.js"></script>
<script>
// Die Daten stehen nur im Link hinter dem „#“ und werden nie an einen Server geschickt.
const STRICH = 10;
const sheet = document.getElementById('sheet');
const content = document.getElementById('content');

function decode(hash) {
  const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  if (text !== undefined) e.textContent = text;
  return e;
}

/** Tabelle für eine Lochhälfte (1–9 oder 10–18): Zeilen = Runden, Spalten = Löcher. */
function table(rounds, from) {
  const t = el('table');
  const hr = t.insertRow();
  hr.append(el('th', { className: 'd' }, 'Loch'));
  for (let h = from; h < from + 9; h++) hr.append(el('th', {}, h));
  for (const r of rounds) {
    const byHole = new Map(r.h.map(([hole, s]) => [hole, s]));
    const tr = t.insertRow();
    tr.append(el('td', { className: 'd' }, r.d));
    for (let h = from; h < from + 9; h++) {
      const s = byHole.get(h);
      tr.append(el('td', s >= STRICH ? { className: 'x' } : {}, s === undefined ? '' : (s >= STRICH ? '–' : s)));
    }
  }
  return t;
}

function render(data) {
  content.append(el('h1', {}, data.t));
  content.append(el('div', { className: 'bar' }));
  let strich = false;
  for (const p of data.p) {
    content.append(el('h2', {}, p.n));
    const front = p.r.filter(r => r.h.some(([h]) => h <= 9));
    const back = p.r.filter(r => r.h.some(([h]) => h >= 10));
    if (front.length) content.append(table(front, 1));
    if (back.length) content.append(table(back, 10));
    strich ||= p.r.some(r => r.h.some(([, s]) => s >= STRICH));
  }
  if (strich) {
    const l = el('div', { className: 'legend' });
    l.append(el('b', {}, '–'), ' = Strich (Bahn beendet)');
    content.append(l);
  }
  document.getElementById('actions').hidden = false;
}

async function shareImage() {
  await document.fonts.ready;
  const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff' });
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  const file = new File([blob], 'golf.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Golf' }); } catch (e) { /* abgebrochen */ }
  } else {
    el('a', { href: URL.createObjectURL(blob), download: 'golf.png' }).click();
  }
}

try {
  const hash = location.hash.slice(1);
  if (!hash) throw new Error('leer');
  render(decode(hash));
  document.getElementById('img').onclick = shareImage;
  document.getElementById('pdf').onclick = () => window.print();
} catch (e) {
  content.className = 'content empty';
  content.append(el('h1', {}, 'Golf Zähler'));
  content.append(el('p', {}, 'Keine Daten. Diese Seite wird über „Teilen → Bild / PDF“ in der Uhr-App geöffnet.'));
}
</script>
</body>
</html>
